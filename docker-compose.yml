version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: invisible_city_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: invisible_city
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invisible_city_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/invisible_city
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
      - JWT_SECRET_KEY=production_secret_key_change_me_in_env
      - JWT_REFRESH_SECRET_KEY=production_refresh_secret_key_change_me_in_env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
